<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu - Samgyupiee</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Noto+Sans+KR:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/main.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brown: {
              light: '#8B6B4D',
              DEFAULT: '#361f10',
              dark: '#1a110b'
            }
          },
          fontFamily: {
            inter: ['Inter', 'sans-serif'],
            noto: ['Noto Serif', 'serif']
          }
        }
      }
    }
  </script>
</head>
<body class="font-inter leading-relaxed text-brown-light">
  <div class="min-h-screen bg-[url('assets/img/menubg.png')] bg-cover bg-center bg-no-repeat relative">
    <header class="w-full px-[5%] py-6 flex justify-center items-center gap-5 absolute top-0 left-0 z-[2] bg-transparent">
      <a href="index.html" class="text-brown font-medium hover:opacity-80">Home</a>
      <a href="menu.html" id="#menu" class="text-brown font-medium hover:opacity-80">Menu</a>
      <a href="#" class="mx-4">
        <img src="assets/img/logo.jpg" alt="Samgyupiee Logo" class="h-[150px] w-auto" loading="lazy">
      </a>
      <a href="order.html" class="text-brown font-medium hover:opacity-80">Order Now</a>
      <a href="index.html#contact" class="text-brown font-medium hover:opacity-80">Contact Us</a>
    </header>

    <div class="absolute top-[200px] left-0 right-0 bottom-0 overflow-y-auto">
      <div class="flex flex-col items-center gap-8 px-4">
        <img src="assets/img/1.png" alt="Menu Item 1" class="w-full max-w-lg">
        <img src="assets/img/2.png" alt="Menu Item 2" class="w-full max-w-lg">
        <img src="assets/img/3.png" alt="Menu Item 3" class="w-full max-w-lg">
        <img src="assets/img/4.png" alt="Menu Item 4" class="w-full max-w-lg">
        <img src="assets/img/5.png" alt="Menu Item 5" class="w-full max-w-lg">
        <img src="assets/img/6.png" alt="Menu Item 6" class="w-full max-w-lg">
        <img src="assets/img/7.png" alt="Menu Item 7" class="w-full max-w-lg">
        <img src="assets/img/8.png" alt="Menu Item 8" class="w-full max-w-lg">
        <div class="h-8"></div>
      </div>
    </div>

    <a href="order.html" class="fixed bottom-8 right-60 bg-brown px-6 py-4 rounded-full shadow-lg hover:bg-brown-dark transition-colors duration-300 flex items-center gap-3">
      <span class="text-white font-medium">Got your choice? Order Now!</span>
      <i class="fas fa-arrow-right text-white"></i>
    </a>
    
    <button onclick="document.querySelector('.overflow-y-auto').scrollTo({ top: 0, behavior: 'smooth' })" class="fixed bottom-8 right-8 bg-brown p-4 rounded-full shadow-lg hover:bg-brown-dark transition-colors duration-300">
      <i class="fas fa-arrow-up text-white"></i>
    </button>
  </div>
</body>
</html>
